apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - image: lebinh89/nest_boilerplate:latest
          name: leon-app-example-backend
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
              name: backend-port
          env:
            - name: DATABASE_HOST
              value: postgres-service
            - name: DATABASE_PORT
              value: '5432'
            - name: DATABASE_USERNAME
              value: test
            - name: DATABASE_PASSWORD
              value: test
            - name: DATABASE_NAME
              value: test_db
            - name: DB_TIMEZONE
              value: UTC
          envFrom:
            - configMapRef:
                name: backend-env-config
      restartPolicy: Always
