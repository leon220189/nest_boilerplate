apiVersion: skaffold/v4beta11
kind: Config
build:
  tagPolicy:
    envTemplate:
      template: "{{.IMAGE_NAME}}:{{.DIGEST}}"
  artifacts:
    - image: backend
      context: .
      docker:
        dockerfile: docker/Dockerfile

deploy:
  helm:
    releases:
      - name: nest-boilerplate-helm
        chartPath: nest-boilerplate-helm
        skipBuildDependencies: true # Skip helm dep build
