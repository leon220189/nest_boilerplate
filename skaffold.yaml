apiVersion: skaffold/v4beta11
kind: Config
build:
  tagPolicy:
    envTemplate:
      template: "{{.IMAGE_NAME}}:{{.DIGEST}}"
  artifacts:
    - image: nest-backend
      context: .
      docker:
        dockerfile: docker/Dockerfile
deploy:
  helm:
    releases:
      - name: nest-helm-dependencies
        chartPath: nest-helm-dependencies
        skipBuildDependencies: true # Skip helm dep build
