apiVersion: skaffold/v4beta11
kind: Config
build:
  tagPolicy:
    envTemplate:
      template: "{{.IMAGE_NAME}}:{{.DIGEST}}"
  artifacts:
    - image: backend-skaffold-helm
      context: .
      docker:
        dockerfile: docker/Dockerfile

deploy:
  helm:
    releases:
      - name: backend
        chartPath: helm-charts/backend
        setValues:
          image: backend-skaffold-helm
        valuesFiles:
          - helm-charts/backend/values.yaml
      - name: postgres
        chartPath: helm-charts/postgres
        setValues:
          postgres.image: postgres:16.2-alpine
        valuesFiles:
          - helm-charts/postgres/values.yaml
