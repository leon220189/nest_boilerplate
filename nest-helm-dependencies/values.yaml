# Default values for nest-helm-dependencies.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

######### postgres env #############
postgres:
  serviceName: postgres-service
  serviceConfig:
    type: LoadBalancer
    port: 5432
  imageConfig:
    repository: postgres:16.2-alpine
    pullPolicy: IfNotPresent
  enabled: true
  deploymentConfig:
    replicaCount: 1

  env:
    POSTGRES_DB: POSTGRES_DB
    POSTGRES_USER: POSTGRES_USER
    POSTGRES_PASSWORD: POSTGRES_PASSWORD
    TZ: TZ
  livenessProbe:
    tcpSocket:
      port: 5432
    initialDelaySeconds: 5
    periodSeconds: 10

  readinessProbe:
    tcpSocket:
      port: 5432
    initialDelaySeconds: 5
    periodSeconds: 10

######### backend env #############
nest-backend:
  serviceConfig:
    type: LoadBalancer
    serviceExternalPort: 3000
    serviceInternalPort: 8888
    serviceName: backend-service

  imageConfig:
    repository: nest-backend:latest
    pullPolicy: IfNotPresent

  deploymentConfig:
    replicaCount: 2

  enabled: true

  livenessProbe:
    httpGet:
      path: /v1
      port: 8888
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  readinessProbe:
    httpGet:
      path: /v1
      port: 8888
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1
    
  env:
    NODE_ENV: local
    PORT: 8888
    APP_PORT: 8888
    API_PREFIX: /v1
    # redis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: redispass
    # database
    DATABASE_USERNAME: test
    DATABASE_PASSWORD: test
    DATABASE_HOST: postgres-service # use this when use k8s
    DATABASE_PORT: 5432 # Internal port for container to container communication
    DATABASE_NAME: test_db
    DATABASE_URL: postgresql://test:test@localhost:5432/test_db?schema=public
    DB_TIMEZONE: UTC
    # JWT
    JWT_SECRET_KEY: binhle
    ACCESS_TOKEN_EXPIRE_TIME: 3600s
    REFRESH_TOKEN_EXPIRE_TIME: 86400s
    # cookie
    COOKIE_SECRET_KEY: binhle@123-COOKIE
    ACCESS_COOKIE_EXPIRE_TIME: 900000
    REFRESH_COOKIE_EXPIRE_TIME: 604800000
    # session
    SESSION_SECRET_KEY: binhle@123-SESSION
    # csrf
    CSRF_TOKEN_HEADER: __Host-blank.X-CSRF-Token
    # mail
    MAIL_HOST: smtp.gmail.com
    MAIL_USER: xxxxxxx
    MAIL_PASSWORD: xxxxxxx
    MAIL_FROM: noreply@example.com
    MAIL_TRANSPORT: xxxxxxx
    FE_URL: ''
    FACEBOOK_APP_ID: xxxxxxx
    FACEBOOK_APP_SECRET: xxxxxxx
    FACEBOOK_APP_REDIRECT_URL: xxxxxxx
    GOOGLE_APP_ID: xxxxxxx
    GOOGLE_APP_SECRET: xxxxxxx
    GOOGLE_APP_REDIRECT_URL: xxxxxxx

# Configuration for Prometheus
prometheus:
  enabled: true
  alertmanager:
    service:
      ports:
        http: 3003  # Port for Alertmanager
  server:
    service:
      type: LoadBalancer
      ports:
        http: 3002  # Port for Prometheus server
    resources:
      limits:
        cpu: 500m
        memory: 1024Mi
      requests:
        cpu: 250m
        memory: 512Mi

    extraScrapeConfigs:
      - job_name: 'node-exporter'
        metrics_path: /metrics
        static_configs:
          - targets: ['nest-helm-dependencies-node-exporter.default.svc.cluster.local:9100']

      - job_name: 'kube-state-metrics'
        metrics_path: /metrics
        static_configs:
          - targets: ['nest-helm-dependencies-kube-state-metrics.default.svc.cluster.local:8080']


# Configuration for Grafana
grafana:
  enabled: true
  service:
    type: LoadBalancer
    ports:
      grafana: 3001  # Desired external port
  admin:
    user: "admincc"
    password: "admin123"
  persistence:
    enabled: true
    storageClass: "metrics-storage"
    size: "10Gi"
  resources:
    limits:
      cpu: "300m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"

node-exporter:
  enabled: true

kube-state-metrics:
  enabled: true

# StorageClass
storageClass:
  name: "metrics-storage"
  provisioner: "k8s.io/minikube-hostpath"
  reclaimPolicy: "Retain"
  allowVolumeExpansion: true
  volumeBindingMode: "WaitForFirstConsumer"

# Locust
locust:
  enabled: true
  service:
    type: LoadBalancer
  # Master node configuration
  master:
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  # Worker nodes configuration
  worker:
    replicas: 1  # Scales the number of workers to simulate more load
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  # Load test configuration
  loadtest:
    locust_locustfile: "locustfile.py"  # The main test entry point
    locust_locustfile_path: "/mnt/locust"  # Path where the files will be mounted
    locust_locustfile_configmap: "locust-test-files"  # ConfigMap name